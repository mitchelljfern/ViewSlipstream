# Slipstream on Netlify.
#
# Branches and where they go:
#   staging  -> branch deploy  https://staging--viewslipstream.netlify.app   (review site, password protected)
#   PRs      -> deploy preview https://deploy-preview-<n>--viewslipstream.netlify.app
#   main     -> PRODUCTION. Blocked until launch (see [context.production]).
#
# Branch deploys and deploy previews don't use production deploy credits.
# Only Mitchell turns production on, at launch.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_REVIEW_MODE = "true"

# LAUNCH GUARD. Production builds fail on purpose, in a second, so a push or
# merge to main can never publish the review build at the real domain or burn
# a production deploy. Remove this block only when Mitchell says it's launch day.
[context.production]
  command = "echo 'Production deploys are turned off until launch. Push to the staging branch instead. See README.md.' && exit 1"

# The review site must never show up in search.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old WordPress addresses keep working.
[[redirects]]
  from = "/login/*"
  to = "/sign-in/"
  status = 301
[[redirects]]
  from = "/rforme/*"
  to = "/sign-in/?mode=create"
  status = 301
[[redirects]]
  from = "/register/*"
  to = "/sign-in/?mode=create"
  status = 301
[[redirects]]
  from = "/in-conversations/*"
  to = "/in-conversation/"
  status = 301
[[redirects]]
  from = "/live/*"
  to = "/now-showing/"
  status = 302

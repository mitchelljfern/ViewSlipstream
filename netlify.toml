# Slipstream on Netlify, linked to GitHub (mitchelljfern/ViewSlipstream).
#
# Branches and where they go:
#   staging  -> branch deploy  https://staging--viewslipstream.netlify.app   (shared review site, no password)
#   PRs      -> deploy preview https://deploy-preview-<n>--viewslipstream.netlify.app
#   main     -> PRODUCTION     https://viewslipstream.netlify.app
#
# Everyone (Social Upgrades, Slipstream, AI assistants) works on staging.
# Only Mitchell can update main: GitHub blocks everyone else (repo ruleset
# "Live site: Mitchell only"). Going live = Mitchell merges staging into main.
#
# Branch deploys and deploy previews don't use production deploy credits.
# Production builds only happen when main changes.

[build]
  command = "npm run build"
  publish = "out"
  # Skip (exit 0) any build that isn't production, staging or a pull request,
  # so stray branches never spend build minutes or credits.
  ignore = "if [ \"$CONTEXT\" = \"production\" ] || [ \"$CONTEXT\" = \"deploy-preview\" ] || [ \"$BRANCH\" = \"staging\" ]; then exit 1; else echo \"Skipping build for branch $BRANCH (only main, staging and pull requests build)\"; exit 0; fi"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Review toolbar (pretend it's showtime, try the access code options). On for
  # staging and pull requests, off on the live site (see [context.production]).
  NEXT_PUBLIC_REVIEW_MODE = "true"
  # Slipstream's own Supabase project (org "View Slipstream"). Public by design:
  # browsers need these, and row level security protects the data. The private
  # service key never goes in this file.
  NEXT_PUBLIC_SUPABASE_URL = "https://sfcifdwmkfekakjjpter.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8Mg_IMn91gDUwQUkIBlKhw_lZq3sytd"

[context.production.environment]
  NEXT_PUBLIC_REVIEW_MODE = "false"

# Not in search yet: viewslipstream.com (WordPress) is still the real site, so
# the netlify.app copies stay out of Google until the domain moves here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Calendar files: served as calendar data so iPhones open "Add to Calendar".
[[headers]]
  for = "/:slug/calendar.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
[[headers]]
  for = "/:slug/closes.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"

# Old WordPress addresses keep working.
[[redirects]]
  from = "/login/*"
  to = "/sign-in/"
  status = 301
[[redirects]]
  from = "/rforme/*"
  to = "/sign-in/?mode=create"
  status = 301
[[redirects]]
  from = "/register/*"
  to = "/sign-in/?mode=create"
  status = 301
[[redirects]]
  from = "/in-conversations/*"
  to = "/in-conversation/"
  status = 301
[[redirects]]
  from = "/live/*"
  to = "/now-showing/"
  status = 302

# Shows added in the Client Hub after the last deploy have no built page yet:
# serve the live show page, which loads them from Supabase. Netlify only uses
# this when no real page exists at that address.
[[redirects]]
  from = "/:slug/"
  to = "/show/"
  status = 200
[[redirects]]
  from = "/:slug"
  to = "/show/"
  status = 200
